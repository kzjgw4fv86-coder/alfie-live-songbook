<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0d">
  <title>Alfie Live Songbook</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0d;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      padding: 20px;
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(11, 11, 13, 0.95);
      backdrop-filter: blur(12px);
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .subtitle {
      margin-top: 4px;
      color: #999;
      font-size: 13px;
    }

    main {
      max-width: 700px;
      margin: auto;
      padding: 12px 16px 120px;
    }

    .card {
      background: #18181c;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .song-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .song-title {
      font-size: 17px;
      font-weight: 700;
    }

    .meta {
      color: #999;
      font-size: 13px;
      margin-top: 4px;
    }

    button {
      border: 0;
      border-radius: 11px;
      padding: 11px 14px;
      background: #29292f;
      color: white;
      font-weight: 700;
      font-size: 14px;
    }

    button.primary {
      background: #f5c542;
      color: #111;
    }

    button:active {
      transform: scale(0.97);
    }

    .hidden {
      display: none;
    }

    .song-header h2 {
      margin: 0;
      font-size: 26px;
    }

    .key {
      color: #f5c542;
      font-weight: 800;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .song-line {
      padding: 13px 8px;
      font-size: 20px;
      line-height: 1.5;
      border-bottom: 1px solid #29292f;
      border-radius: 8px;
    }

    .song-line.current {
      background: #302c1d;
    }

    .chord {
      color: #f5c542;
      font-weight: 800;
      margin-right: 9px;
    }

    .bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      background: rgba(17, 17, 22, 0.96);
      padding: 10px;
      backdrop-filter: blur(12px);
    }

    .bottom-inner {
      max-width: 700px;
      margin: auto;
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .meter {
      height: 6px;
      background: #29292f;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 12px;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      background: #f5c542;
      transition: width 0.08s linear;
    }

    .status {
      margin-top: 8px;
      color: #999;
      font-size: 13px;
      text-align: center;
    }

    .empty {
      color: #999;
      text-align: center;
      padding: 30px 10px;
    }
  </style>
</head>

<body>

<header id="header">
  <h1>🎸 Alfie Live Songbook</h1>
  <div class="subtitle">
    Live performance songbook • Prototype
  </div>
</header>

<main>

  <!-- LIBRARY -->

  <section id="library">

    <div class="card">
      <strong>Your Songs</strong>
      <div class="meta">
        Prototype songs for testing the system.
      </div>
    </div>

    <div id="songList"></div>

  </section>


  <!-- SONG VIEW -->

  <section id="songView" class="hidden">

    <div class="card song-header">

      <h2 id="songTitle"></h2>

      <div class="meta">
        Your key:
        <span class="key" id="songKey"></span>

        &nbsp; • &nbsp;

        Capo:
        <span id="songCapo"></span>
      </div>

      <div class="controls">

        <button onclick="transpose(-1)">
          − Semitone
        </button>

        <button onclick="transpose(1)">
          + Semitone
        </button>

        <button onclick="resetTranspose()">
          Reset
        </button>

      </div>

    </div>


    <div class="card">

      <div id="lyrics"></div>

    </div>


    <div class="card">

      <strong>🎤 Live Follow Test</strong>

      <div class="meta">
        Microphone audio detection prototype.
      </div>

      <div class="meter">
        <div
          id="meterFill"
          class="meter-fill">
        </div>
      </div>

      <div
        id="micStatus"
        class="status">
        Microphone off
      </div>

      <div class="controls">

        <button
          id="micButton"
          class="primary"
          onclick="toggleMicrophone()">
          Enable microphone
        </button>

        <button onclick="nextLine()">
          Next line
        </button>

        <button onclick="previousLine()">
          Previous line
        </button>

      </div>

    </div>

  </section>

</main>


<!-- BOTTOM NAVIGATION -->

<div
  id="bottomBar"
  class="bottom-bar hidden">

  <div class="bottom-inner">

    <button onclick="showLibrary()">
      ← Library
    </button>

  </div>

</div>


<script>

const songs = [

  {
    title: "Amazing Grace",
    key: "G",
    capo: 0,

    lines: [

      {
        chord: "G",
        text: "Amazing grace, how sweet the sound"
      },

      {
        chord: "C",
        text: "That saved a wretch like me"
      },

      {
        chord: "G",
        text: "I once was lost, but now am found"
      },

      {
        chord: "D",
        text: "Was blind, but now I see"
      },

      {
        chord: "G",
        text: "'Twas grace that taught my heart to fear"
      },

      {
        chord: "C",
        text: "And grace my fears relieved"
      },

      {
        chord: "G",
        text: "How precious did that grace appear"
      },

      {
        chord: "D",
        text: "The hour I first believed"
      }

    ]
  },


  {
    title: "This Little Light of Mine",
    key: "G",
    capo: 0,

    lines: [

      {
        chord: "G",
        text: "This little light of mine"
      },

      {
        chord: "C",
        text: "I'm gonna let it shine"
      },

      {
        chord: "G",
        text: "This little light of mine"
      },

      {
        chord: "D",
        text: "I'm gonna let it shine"
      },

      {
        chord: "G",
        text: "Everywhere I go"
      },

      {
        chord: "C",
        text: "I'm gonna let it shine"
      },

      {
        chord: "G",
        text: "Everywhere I go"
      },

      {
        chord: "D",
        text: "I'm gonna let it shine"
      }

    ]
  },


  {
    title: "Alfie Demo Song",
    key: "E",
    capo: 0,

    lines: [

      {
        chord: "E",
        text: "I'm walking down the road tonight"
      },

      {
        chord: "A",
        text: "With a song that I wrote for you"
      },

      {
        chord: "E",
        text: "The city lights are fading out"
      },

      {
        chord: "B",
        text: "And the sky is turning blue"
      },

      {
        chord: "E",
        text: "I keep the rhythm with my feet"
      },

      {
        chord: "A",
        text: "And let the old guitar ring"
      },

      {
        chord: "E",
        text: "One more chorus, one more night"
      },

      {
        chord: "B",
        text: "One more reason to sing"
      }

    ]
  }

];


const noteNames = [
  "C",
  "C#",
  "D",
  "D#",
  "E",
  "F",
  "F#",
  "G",
  "G#",
  "A",
  "A#",
  "B"
];


let currentSong = null;

let transposeAmount = 0;

let currentLine = 0;

let microphoneActive = false;

let animationFrame = null;

let audioStream = null;

let audioContext = null;



/* -------------------------
   LIBRARY
------------------------- */


function renderLibrary() {

  const container =
    document.getElementById("songList");

  container.innerHTML = "";

  songs.forEach((song, index) => {

    const card =
      document.createElement("div");

    card.className = "card";

    card.innerHTML = `

      <div class="song-row">

        <div>

          <div class="song-title">
            ${song.title}
          </div>

          <div class="meta">
            Key ${song.key}
            • ${song.lines.length} lines
          </div>

        </div>

        <button class="primary">
          Open
        </button>

      </div>

    `;

    card
      .querySelector("button")
      .addEventListener(
        "click",
        () => openSong(index)
      );

    container.appendChild(card);

  });

}



/* -------------------------
   SONG
------------------------- */


function openSong(index) {

  currentSong = index;

  transposeAmount = 0;

  currentLine = 0;

  document
    .getElementById("library")
    .classList
    .add("hidden");

  document
    .getElementById("songView")
    .classList
    .remove("hidden");

  document
    .getElementById("bottomBar")
    .classList
    .remove("hidden");

  document
    .getElementById("header")
    .classList
    .add("hidden");

  renderSong();

  window.scrollTo({
    top: 0,
    behavior: "instant"
  });

}



/* -------------------------
   RENDER SONG
------------------------- */


function renderSong() {

  const song =
    songs[currentSong];

  document
    .getElementById("songTitle")
    .textContent =
    song.title;

  document
    .getElementById("songKey")
    .textContent =
    transposeKey(
      song.key,
      transposeAmount
    );

  document
    .getElementById("songCapo")
    .textContent =
    song.capo;

  const lyrics =
    document.getElementById("lyrics");

  lyrics.innerHTML = "";

  song.lines.forEach(
    (line, index) => {

      const element =
        document.createElement("div");

      element.className =
        "song-line";

      if (index === currentLine) {
        element.classList.add(
          "current"
        );
      }

      element.id =
        "song-line-" + index;

      element.innerHTML = `

        <span class="chord">
          ${transposeKey(
            line.chord,
            transposeAmount
          )}
        </span>

        ${line.text}

      `;

      lyrics.appendChild(element);

    }
  );

}



/* -------------------------
   TRANSPOSE
------------------------- */


function transposeKey(
  key,
  amount
) {

  const index =
    noteNames.indexOf(key);

  if (index === -1) {
    return key;
  }

  let newIndex =
    (index + amount) % 12;

  if (newIndex < 0) {
    newIndex += 12;
  }

  return noteNames[newIndex];

}



function transpose(amount) {

  transposeAmount += amount;

  renderSong();

}



function resetTranspose() {

  transposeAmount = 0;

  renderSong();

}



/* -------------------------
   LINE NAVIGATION
------------------------- */


function highlightLine() {

  document
    .querySelectorAll(".song-line")
    .forEach(
      element =>
        element.classList.remove(
          "current"
        )
    );

  const element =
    document.getElementById(
      "song-line-" + currentLine
    );

  if (!element) {
    return;
  }

  element.classList.add(
    "current"
  );

  element.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });

}



function nextLine() {

  if (!currentSong) {
    if (currentSong !== 0) {
      return;
    }
  }

  const song =
    songs[currentSong];

  if (
    currentLine <
    song.lines.length - 1
  ) {

    currentLine++;

    highlightLine();

  }

}



function previousLine() {

  if (!currentSong) {
    if (currentSong !== 0) {
      return;
    }
  }

  if (currentLine > 0) {

    currentLine--;

    highlightLine();

  }

}



/* -------------------------
   MICROPHONE
------------------------- */


async function toggleMicrophone() {

  if (microphoneActive) {

    stopMicrophone();

    return;

  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    document
      .getElementById("micStatus")
      .textContent =
      "Microphone isn't supported here.";

    return;

  }


  try {

    audioStream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio: true
        });


    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    const source =
      audioContext
        .createMediaStreamSource(
          audioStream
        );


    const analyser =
      audioContext
        .createAnalyser();


    analyser.fftSize = 2048;


    source.connect(analyser);


    const buffer =
      new Float32Array(
        analyser.fftSize
      );


    microphoneActive = true;


    document
      .getElementById("micButton")
      .textContent =
      "Stop microphone";


    document
      .getElementById("micStatus")
      .textContent =
      "Listening…";


    function analyse() {

      if (!microphoneActive) {
        return;
      }

      analyser.getFloatTimeDomainData(
        buffer
      );


      let total = 0;

      for (
        let i = 0;
        i < buffer.length;
        i++
      ) {

        total +=
          buffer[i] *
          buffer[i];

      }


      const rms =
        Math.sqrt(
          total /
          buffer.length
        );


      const percentage =
        Math.min(
          100,
          rms * 900
        );


      document
        .getElementById("meterFill")
        .style
        .width =
        percentage + "%";


      document
        .getElementById("micStatus")
        .textContent =
        rms > 0.012
          ? "🎸 Guitar/audio detected"
          : "Listening…";


      animationFrame =
        requestAnimationFrame(
          analyse
        );

    }


    analyse();


  } catch (error) {

    document
      .getElementById("micStatus")
      .textContent =
      "Microphone permission was not granted.";

  }

}



function stopMicrophone() {

  microphoneActive = false;


  if (animationFrame) {

    cancelAnimationFrame(
      animationFrame
    );

    animationFrame = null;

  }


  if (audioStream) {

    audioStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    audioStream = null;

  }


  if (audioContext) {

    audioContext.close();

    audioContext = null;

  }


  document
    .getElementById("micButton")
    .textContent =
    "Enable microphone";


  document
    .getElementById("micStatus")
    .textContent =
    "Microphone off";


  document
    .getElementById("meterFill")
    .style
    .width =
    "0%";

}



/* -------------------------
   BACK TO LIBRARY
------------------------- */


function showLibrary() {

  stopMicrophone();

  document
    .getElementById("songView")
    .classList
    .add("hidden");

  document
    .getElementById("library")
    .classList
    .remove("hidden");

  document
    .getElementById("bottomBar")
    .classList
    .add("hidden");

  document
    .getElementById("header")
    .classList
    .remove("hidden");

}



/* -------------------------
   START
------------------------- */


renderLibrary();

</script>

</body>
</html>
