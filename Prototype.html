<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>Alfie Live Songbook</title><style>body{margin:0;background:#0b0b0d;color:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{padding:18px;position:sticky;top:0;background:#0b0b0df2;backdrop-filter:blur(12px);z-index:3}main{padding:10px 14px 100px;max-width:760px;margin:auto}.card{background:#17171b;border-radius:16px;padding:15px;margin:10px 0}.song{display:flex;justify-content:space-between;align-items:center}.meta,.note{color:#a1a1aa;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:11px 13px;background:#29292f;color:white;font-weight:600}.primary{background:#f5c542;color:#111}.line{font-size:21px;line-height:1.55;padding:10px 5px;border-bottom:1px solid #29292f}.chord{color:#f5c542;font-weight:800;margin-right:9px}.current{background:#302c1d;border-radius:10px}.controls{position:fixed;bottom:0;left:0;right:0;padding:10px;background:#111116ed;z-index:4}.inner{max-width:760px;margin:auto;display:flex;justify-content:center;gap:7px}.meter{height:5px;background:#29292f;border-radius:5px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:#f5c542}#stage{display:none}</style></head><body><header><h1>🎸 Alfie Live Songbook</h1><div class="meta">Private prototype • live-performance songbook</div></header><main id="library"></main><section id="stage"><main><div class="card"><h2 id="title"></h2><div class="meta">Your key: <b id="key"></b> • Capo: <span id="capo"></span></div><div class="row" style="margin-top:12px"><button onclick="transpose(-1)">− Semitone</button><button onclick="transpose(1)">+ Semitone</button><button onclick="resetKey()">Reset</button></div></div><div class="card" id="songLines"></div><div class="card"><b>🎤 Live-follow test</b><p class="note">This first prototype listens to your microphone and shows live signal activity. Reliable musical following comes next, after testing the audio engine with your guitar.</p><div class="meter"><i id="meter"></i></div><div class="meta" id="status">Microphone off</div><div class="row" style="margin-top:9px"><button class="primary" id="micBtn" onclick="toggleMic()">Enable microphone</button><button onclick="toggleAuto()">Auto-scroll</button></div></div></main></section><div class="controls" id="controls" style="display:none"><div class="inner"><button onclick="back()">← Library</button><button onclick="prev()">◀</button><button class="primary" onclick="next()">Next ▶</button></div></div><script>
const songs=[
{title:'Amazing Grace',key:'G',capo:0,lines:[['Amazing grace, how sweet the sound','G'],['That saved a wretch like me','C'],['I once was lost, but now am found','G'],['Was blind, but now I see','D'],["'Twas grace that taught my heart to fear",'G'],['And grace my fears relieved','C'],['How precious did that grace appear','G'],['The hour I first believed','D']]},
{title:'This Little Light of Mine',key:'G',capo:0,lines:[["This little light of mine",'G'],["I'm gonna let it shine",'C'],["This little light of mine",'G'],["I'm gonna let it shine",'D'],['Everywhere I go','G'],["I'm gonna let it shine",'C'],['Everywhere I go','G'],["I'm gonna let it shine",'D']]},
{title:'Alfie Demo Song',key:'E',capo:0,lines:[["I'm walking down the road tonight",'E'],['With a song that I wrote for you','A'],['The city lights are fading out','E'],['And the sky is turning blue','B'],['I keep the rhythm with my feet','E'],['And let the old guitar ring','A'],['One more chorus, one more night','E'],['One more reason to sing','B']]}
];
const notes=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];let current=0,offset=0,mic=false,raf;
function library(){document.getElementById('library').innerHTML='<div class="card"><b>Your songs</b><p class="note">Three demo songs are included. The architecture is ready for your own setlist.</p></div>'+songs.map((s,i)=>`<div class="card song"><div><b>${s.title}</b><div class="meta">Key ${s.key} • ${s.lines.length} lines</div></div><button class="primary" onclick="openSong(${i})">Open</button></div>`).join('')}
function shift(k,n){let i=notes.indexOf(k);return notes[(i+n+120)%12]||k}function openSong(i){current=i;offset=0;document.querySelector('header').style.display='none';document.getElementById('library').style.display='none';document.getElementById('stage').style.display='block';document.getElementById('controls').style.display='block';render()}function render(){let s=songs[current];document.getElementById('title').textContent=s.title;document.getElementById('key').textContent=shift(s.key,offset);document.getElementById('capo').textContent=s.capo;document.getElementById('songLines').innerHTML=s.lines.map((x,i)=>`<div class="line ${i?'':'current'}" id="line${i}"><span class="chord">${shift(x[1],offset)}</span>${x[0]}</div>`).join('')}function transpose(n){offset+=n;render()}function resetKey(){offset=0;render()}function next(){let e=document.querySelector('.current'),i=e?+e.id.replace('line',''):0;if(i<songs[current].lines.length-1){e.classList.remove('current');let n=document.getElementById('line'+(i+1));n.classList.add('current');n.scrollIntoView({behavior:'smooth',block:'center'})}}function prev(){let e=document.querySelector('.current'),i=e?+e.id.replace('line',''):0;if(i>0){e.classList.remove('current');let n=document.getElementById('line'+(i-1));n.classList.add('current');n.scrollIntoView({behavior:'smooth',block:'center'})}}function back(){stopMic();document.getElementById('stage').style.display='none';document.getElementById('controls').style.display='none';document.getElementById('library').style.display='block';document.querySelector('header').style.display='block'}
async function toggleMic(){if(mic){stopMic();return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});let ctx=new AudioContext(),src=ctx.createMediaStreamSource(stream),a=ctx.createAnalyser();a.fftSize=2048;src.connect(a);let buf=new Float32Array(a.fftSize);mic=true;window._stream=stream;window._ctx=ctx;document.getElementById('micBtn').textContent='Stop microphone';function loop(){if(!mic)return;a.getFloatTimeDomainData(buf);let rms=Math.sqrt(buf.reduce((x,v)=>x+v*v,0)/buf.length);document.getElementById('meter').style.width=Math.min(100,rms*900)+'%';document.getElementById('status').textContent=rms>.012?'🎸 Guitar/audio detected':'Listening…';raf=requestAnimationFrame(loop)}loop()}catch(e){document.getElementById('status').textContent='Microphone permission unavailable.'}}function stopMic(){mic=false;if(raf)cancelAnimationFrame(raf);if(window._stream)window._stream.getTracks().forEach(t=>t.stop());if(window._ctx)window._ctx.close();document.getElementById('micBtn').textContent='Enable microphone';document.getElementById('status').textContent='Microphone off';document.getElementById('meter').style.width='0'}function toggleAuto(){let on=true;let id=setInterval(()=>{if(!on)return;next()},2800);setTimeout(()=>{on=false;clearInterval(id)},songs[current].lines.length*3000)}library();
</script></body></html>
